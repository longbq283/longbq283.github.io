<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quản lý Hồ sơ Ứng viên AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Nhúng thư viện PDF.js để đọc file CV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';</script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; border-bottom: 2px solid #d1d5db; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-sm mb-8 text-center py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Trình Quản lý Hồ sơ Ứng viên</h1>
        <p class="text-gray-500">Hệ thống Đánh giá CV tự động bằng Gemini AI</p>
    </header>

    <div class="max-w-5xl mx-auto px-4 pb-12">
        
        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-6 justify-center">
            <button onclick="switchTab('jd-tab')" id="btn-jd-tab" class="tab-active px-6 py-3 transition-colors duration-200 focus:outline-none">
                <i class="fas fa-list-check mr-2"></i>Tiêu chí Tuyển dụng (JD)
            </button>
            <button onclick="switchTab('candidate-tab')" id="btn-candidate-tab" class="tab-inactive px-6 py-3 transition-colors duration-200 focus:outline-none">
                <i class="fas fa-user-plus mr-2"></i>Đánh giá Ứng viên
            </button>
        </div>

        <!-- TAB 1: JD -->
        <div id="jd-tab" class="bg-white rounded-lg shadow-md p-6 sm:p-8 block">
            <h2 class="text-xl font-bold text-gray-700 mb-6 border-b pb-4">Cấu hình Tiêu chí Tuyển dụng</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Tên vị trí:</label>
                    <input type="text" id="jd-title" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-blue-500" value="Chuyên viên Phân tích Nghiệp vụ (BA) - Hệ thống Core Banking">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Nội dung Mô tả & Yêu cầu chi tiết (JD):</label>
                    <textarea id="jd-content" rows="6" class="w-full border border-gray-300 rounded p-3 focus:outline-none focus:border-blue-500 text-sm">Thực hiện thu thập và phân tích yêu cầu nghiệp vụ liên quan đến hệ thống Core Banking và các hệ thống vệ tinh. Chuyển đổi yêu cầu thành tài liệu URD, RSD. Yêu cầu có kinh nghiệm làm việc với hệ thống (không phải app), am hiểu kiến trúc dữ liệu và tích hợp API. Yêu cầu Tiếng Anh tương đương IELTS 5.5.</textarea>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="alert('Đã lưu tiêu chí thành công!')" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition font-semibold">Lưu Tiêu Chí</button>
            </div>
        </div>

        <!-- TAB 2: ỨNG VIÊN -->
        <div id="candidate-tab" class="bg-white rounded-lg shadow-md p-6 sm:p-8 hidden">
            <h2 class="text-xl font-bold text-gray-700 mb-6 border-b pb-4">Tải CV và Đánh giá tự động</h2>
            
            <div class="bg-blue-50 p-6 rounded-lg border border-blue-100 mb-8">
                <!-- KHU VỰC UPLOAD FILE -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">Chọn file CV (Hỗ trợ định dạng PDF)</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-white border-blue-300 hover:bg-blue-50 transition">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500">
                                <i class="fas fa-cloud-upload-alt text-3xl mb-2 text-blue-500"></i>
                                <p class="mb-1 text-sm" id="file-name-display"><span class="font-semibold text-blue-600">Click để chọn file PDF</span></p>
                            </div>
                            <input type="file" id="cv-upload" class="hidden" accept=".pdf" onchange="handleFileSelect(event)" />
                        </label>
                    </div>
                </div>

                <!-- HOẶC PASTE TEXT (Dự phòng) -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-800 mb-2">Hoặc dán trực tiếp nội dung CV vào đây (Nếu không dùng file):</label>
                    <textarea id="cv-text" rows="4" class="w-full border border-gray-300 rounded p-3 focus:outline-none focus:border-blue-500 text-sm" placeholder="Nội dung CV sẽ xuất hiện ở đây sau khi chọn file..."></textarea>
                </div>

                <button id="btn-evaluate" onclick="evaluateWithGemini()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-md transition shadow-md">
                    <i class="fas fa-magic mr-2"></i> Yêu cầu AI Đánh giá & Sinh câu hỏi
                </button>
            </div>

            <!-- KHU VỰC HIỂN THỊ KẾT QUẢ TỪ AI -->
            <div id="ai-results" class="hidden mt-10 border-t pt-8">
                <!-- Nội dung HTML sinh ra từ Gemini sẽ được chèn trực tiếp vào đây -->
            </div>
            
            <div id="export-btns" class="hidden justify-end gap-3 mt-4">
                <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700 transition">
                    <i class="fas fa-print mr-2"></i>In / Lưu PDF Báo Cáo
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Chuyển Tab ---
        function switchTab(tabId) {
            document.getElementById('jd-tab').classList.add('hidden');
            document.getElementById('candidate-tab').classList.add('hidden');
            document.getElementById('btn-jd-tab').className = "tab-inactive px-6 py-3 transition-colors duration-200 focus:outline-none";
            document.getElementById('btn-candidate-tab').className = "tab-inactive px-6 py-3 transition-colors duration-200 focus:outline-none";
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "tab-active px-6 py-3 transition-colors duration-200 focus:outline-none";
        }

        // --- 2. Xử lý đọc file PDF khi user upload ---
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('file-name-display').innerHTML = `<span class="text-green-600 font-semibold"><i class="fas fa-check mr-1"></i> Đã chọn: ${file.name}</span>`;
            document.getElementById('cv-text').value = "Đang trích xuất chữ từ PDF...";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + '\n';
                }
                document.getElementById('cv-text').value = text; // Hiển thị text đọc được
            } catch (error) {
                console.error(error);
                document.getElementById('cv-text').value = "Lỗi đọc file PDF. Vui lòng copy và dán trực tiếp text CV vào ô này.";
            }
        }

        // --- 3. GỌI API GEMINI ---
        async function evaluateWithGemini() {
            // MÃ API KEY CỦA BẠN 
            const API_KEY = "AQ.Ab8RN6LdpfAjGcMq4MI9VdICkwfKofNjbc2dR_s6Xo9xOStoqg"; 
            
            const jdTitle = document.getElementById('jd-title').value;
            const jdContent = document.getElementById('jd-content').value;
            const cvText = document.getElementById('cv-text').value;
            const btn = document.getElementById('btn-evaluate');
            const resultDiv = document.getElementById('ai-results');

            if (!cvText || cvText.trim() === "") {
                alert("Vui lòng tải lên CV hoặc dán nội dung CV vào ô văn bản!");
                return;
            }

            // Hiệu ứng Loading
            btn.innerHTML = '<i class="fas fa-spinner spinner mr-2"></i> AI đang phân tích và chấm điểm... (Khoảng 10-15s)';
            btn.classList.replace('bg-purple-600', 'bg-gray-500');
            btn.disabled = true;

            // Xây dựng Prompt cho AI
            const prompt = `
Bạn là chuyên gia tuyển dụng cấp cao. Hãy đánh giá ứng viên cho vị trí: ${jdTitle}.
[TIÊU CHÍ TUYỂN DỤNG (JD)]:
${jdContent}

[NỘI DUNG CV]:
${cvText}

YÊU CẦU ĐẦU RA (RẤT QUAN TRỌNG):
1. CHỈ TRẢ VỀ MÃ HTML THUẦN TÚY. Tuyệt đối KHÔNG sử dụng Markdown, KHÔNG bọc trong \`\`\`html.
2. Trả về đầy đủ 2 Phần: Báo cáo Đánh giá (7 mục chuẩn thẻ h2, h3) VÀ Bộ 5 câu hỏi phỏng vấn (chuẩn thẻ div, màu sắc).
3. Đảm bảo cấu trúc HTML dùng CSS inline chuẩn như đã cấu hình.

Cấu trúc bắt buộc:
<div class="report-section mb-10">
    <h1 class="text-2xl font-bold text-gray-700 mb-6 border-b pb-2">BÁO CÁO ĐÁNH GIÁ HỒ SƠ ỨNG VIÊN</h1>
    <h2 style="font-size: 1.25rem; font-weight: 600; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; margin-bottom: 1rem;">1. Tổng quan</h2>
    <!-- Nội dung trích xuất... -->
    <!-- Tiếp tục các phần 2 đến 7... -->
</div>
<div class="questions-section">
    <h1 class="text-2xl font-bold mt-10 mb-6 border-b pb-2 text-gray-700">BỘ CÂU HỎI PHỎNG VẤN GỢI Ý</h1>
    <!-- 5 Câu hỏi dùng thẻ div có class viền, nền màu xanh/vàng cho gợi ý/thang điểm -->
</div>
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.2 }
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }

                let htmlContent = data.candidates[0].content.parts[0].text;
                // Xóa bỏ markdown html nếu AI lỡ sinh ra
                htmlContent = htmlContent.replace(/```html/g, '').replace(/```/g, '');

                resultDiv.innerHTML = htmlContent;
                resultDiv.classList.remove('hidden');
                document.getElementById('export-btns').classList.remove('hidden');
                document.getElementById('export-btns').classList.add('flex');
                
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Phân tích Hoàn tất';
                btn.classList.replace('bg-gray-500', 'bg-green-600');

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi gọi API: Vui lòng kiểm tra lại chính xác đoạn mã API KEY của bạn. (Chi tiết lỗi: " + error.message + ")");
                btn.innerHTML = '<i class="fas fa-magic mr-2"></i> Yêu cầu AI Đánh giá lại';
                btn.classList.replace('bg-gray-500', 'bg-purple-600');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
